<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Keuangan OSIS</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>

    <div class="clouds">
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div> </div>


<!-- LOGIN -->

<div
    id="loginModal"
    class="login-modal"
>

    <div class="login-box">

        <button
            type="button"
            class="close-login"
            onclick="tutupLogin()"
        >
            ×
        </button>


        <h2>
            Login Admin
        </h2>


        <p>
            Login untuk mengelola transaksi.
        </p>


        <form id="loginForm">

            <label>
                Username
            </label>

            <input
                type="text"
                id="username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                required
            >


            <button type="submit">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </button>

        </form>

    </div>

</div>



<!-- HEADER -->

<header>

    <h2>

        <i class="fa-solid fa-wallet"></i>

        Keuangan OSIS SMKN 10 Samarinda

    </h2>


    <button
        type="button"
        id="loginButton"
        class="login-button"
        onclick="bukaLogin()"
    >

        <i class="fa-solid fa-lock"></i>

        Login Admin

    </button>

</header>



<div class="container">


    <!-- SALDO -->

    <div class="cards">

        <div class="card saldo">

            <h3>
                Saldo
            </h3>

            <h1 id="saldo">
                Rp 0
            </h1>

        </div>

    </div>



    <!-- INPUT TRANSAKSI -->

    <div
        class="form-box"
        id="formTransaksiBox"
    >

        <h2>
            Input Transaksi
        </h2>


        <form id="formKeuangan">


            <label for="tanggal">
                Tanggal
            </label>

            <input
                type="date"
                id="tanggal"
                required
            >


            <label for="jenis">
                Jenis
            </label>

            <select id="jenis">

                <option value="Pemasukan">
                    Pemasukan
                </option>

                <option value="Pengeluaran">
                    Pengeluaran
                </option>

            </select>


            <label for="nominal">
                Nominal (Rp)
            </label>

            <input
                type="text"
                id="nominal"
                placeholder="Contoh: 25.000"
                inputmode="numeric"
                required
            >


            <label for="keterangan">
                Keterangan
            </label>

            <textarea
                id="keterangan"
                placeholder="Masukkan keterangan..."
                required
            ></textarea>


            <button
                type="submit"
                id="submitButton"
            >

                <i class="fa-solid fa-plus"></i>

                Tambah Data

            </button>

        </form>

    </div>



    <!-- RIWAYAT -->

    <div class="table-box">

    <div class="table-header">

        <h2>
            Riwayat Transaksi
        </h2>

        <!-- FILTER BULAN -->

        <div class="filter-box">

            <label for="filterBulan">
                Filter Bulan
            </label>

            <select id="filterBulan">

                <option value="all">
                    Semua Bulan
                </option>

                <option value="0">
                    September 2026
                </option>

                <option value="1">
                    Oktober 2026
                </option>

                <option value="2">
                    November 2026
                </option>

                <option value="3">
                    Desember 2026
                </option>

                <option value="4">
                    Januari 2027
                </option>

                <option value="5">
                    Februari 2027
                </option>

                <option value="6">
                    Maret 2027
                </option>

                <option value="7">
                    April 2027
                </option>

                <option value="8">
                    Mei 2027
                </option>

                <option value="9">
                    Juni 2027
                </option>

                <option value="10">
                    Juli 2027
                </option>

                <option value="11">
                    Agustus 2027
                </option>

            </select>

        </div>

    </div>


    <!-- TABEL SCROLL -->

    <div class="table-scroll">

        <table>

            <thead>

                <tr>

                    <th>
                        No
                    </th>

                    <th>
                        Tanggal
                    </th>

                    <th>
                        Keterangan
                    </th>

                    <th>
                        Pemasukan
                    </th>

                    <th>
                        Pengeluaran
                    </th>

                    <th>
                        Saldo
                    </th>

                </tr>

            </thead>


            <tbody id="dataTransaksi">

                <tr>

                    <td colspan="6">
                        Memuat data...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script src="script.js"></script>


</body>

</html>
